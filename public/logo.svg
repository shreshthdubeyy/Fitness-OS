<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Hexagon Badge -->
  <polygon points="256,32 448,142 448,370 256,480 64,370 64,142" fill="#0f172a" stroke="url(#blueGlow)" stroke-width="12" stroke-linejoin="round"/>
  <polygon points="256,48 432,150 432,362 256,464 80,362 80,150" fill="none" stroke="#2563eb" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Geometric Dumbbell Center -->
  <g transform="translate(0, 10)">
    <!-- Central Bar -->
    <rect x="190" y="244" width="132" height="24" rx="6" fill="url(#silverPlate)"/>
    
    <!-- Left Inner Collar -->
    <rect x="174" y="226" width="16" height="60" rx="4" fill="url(#blueGlow)"/>
    <!-- Right Inner Collar -->
    <rect x="322" y="226" width="16" height="60" rx="4" fill="url(#blueGlow)"/>
    
    <!-- Left Weight Plates -->
    <path d="M 120,200 L 164,216 L 164,296 L 120,312 Z" fill="url(#silverPlate)" stroke="#1e293b" stroke-width="2"/>
    <path d="M 96,214 L 116,222 L 116,290 L 96,298 Z" fill="url(#silverPlate)"/>
    
    <!-- Right Weight Plates -->
    <path d="M 392,200 L 348,216 L 348,296 L 392,312 Z" fill="url(#silverPlate)" stroke="#1e293b" stroke-width="2"/>
    <path d="M 416,214 L 396,222 L 396,290 L 416,298 Z" fill="url(#silverPlate)"/>
    
    <!-- Bar End Caps -->
    <rect x="80" y="248" width="16" height="16" rx="4" fill="url(#silverPlate)"/>
    <rect x="416" y="248" width="16" height="16" rx="4" fill="url(#silverPlate)"/>
  </g>

  <!-- Typography Badging -->
  <text x="256" y="385" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="4">FITNESS OS</text>
  <line x1="160" y1="405" x2="352" y2="405" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
</svg>
